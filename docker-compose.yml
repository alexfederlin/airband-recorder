# Starts the recorder and the timeline, and Rdio Scanner if enabled.
# Settings come from the .env file next to this one (copy .env.example, or run
# ./migrate-from-bare-metal.sh when moving from the systemd install).
# Recordings and Rdio Scanner's database are kept in ./data unless .env points
# ARCHIVE_DIR / RDIO_DATA elsewhere.

services:
  # Optional: only started with COMPOSE_PROFILES=rdio in .env
  # (or "docker compose --profile rdio up -d")
  rdio-scanner:
    image: chuot/rdio-scanner:latest
    profiles: ["rdio"]
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"   # owner of RDIO_DATA, as Rdio Scanner's docs recommend
    ports:
      - "3000:3000"
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${RDIO_DATA:-./data/rdio-scanner}:/app/data

  recorder:
    build:
      context: ./recorder
      network: host          # build steps use the host's DNS (Docker's own can fail)
    restart: unless-stopped
    init: true
    devices:
      - /dev/snd:/dev/snd
    environment:
      TZ: ${TZ:-Europe/Berlin}
      DEVICE: ${DEVICE:-plughw:CARD=Device,DEV=0}
      KEY: ${KEY:-}
      SYSTEM: ${SYSTEM:-1}
      TALKGROUP: ${TALKGROUP:-1}
      FREQ: ${FREQ:-118000000}
      THRESHOLD: ${THRESHOLD:-2%}
      HANG: ${HANG:-2.0}
      MIN_LEN: ${MIN_LEN:-0.5}
      API: http://rdio-scanner:3000/api/call-upload
      DIR: /data/recordings
      ARCHIVE: /data/archive
    volumes:
      - ./data:/data
      - ${ARCHIVE_DIR:-./data/archive}:/data/archive

  timeline:
    build:
      context: ./timeline
      network: host
      args:
        WHISPER_MODEL_NAME: ${WHISPER_MODEL_NAME:-base}
    restart: unless-stopped
    init: true
    ports:
      - "8090:8090"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      WHISPER_LANG: ${WHISPER_LANG:-en}
      WHISPER_THREADS: ${WHISPER_THREADS:-4}
      # The model built into the image, unless .env names a file in ./models
      # (mounted at /extra-models), e.g. an ATC fine-tune from the test set
      WHISPER_MODEL: ${WHISPER_MODEL:-/models/ggml-${WHISPER_MODEL_NAME:-base}.bin}
      RETRANSCRIBE: ${RETRANSCRIBE:-1}
      KEEP_DAYS: ${KEEP_DAYS:-30}
    volumes:
      - ${ARCHIVE_DIR:-./data/archive}:/data/archive
      - ./models:/extra-models:ro
